name: Weekly race fetch
on:
  schedule:
    - cron: '30 3 * * 1'   # Mondays 03:30 UTC = 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch sources and update races.json
        run: node scripts/fetch.mjs
      - name: Commit updated data
        run: |
          git config user.name "PuneAfterhours"
          git config user.email "team@puneafterhours.local"
          git add races.json
          git diff --cached --quiet || git commit -m "Weekly fetch: race data update"
          git push
