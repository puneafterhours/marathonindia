name: Daily race fetch
on:
  schedule:
    - cron: '17 6,14,22 * * *'   # Every 8 hours, off-peak minute: 11:47, 19:47, 03:47 IST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install headless Chromium for JS-rendered registration pages
        timeout-minutes: 15
        run: |
          sudo apt-get update
          npm install playwright
          npx playwright install --with-deps --only-shell chromium
      - name: Fetch sources and update races.json
        env:
          PLAYWRIGHT: '1'
        run: |
          node scripts/fetch.mjs
          node scripts/news.mjs
      - name: Commit updated data
        run: |
          git config user.name "PuneAfterhours"
          git config user.email "team@puneafterhours.local"
          git add races.json meta.json news.json index.html sitemap.xml robots.txt
          git diff --cached --quiet || git commit -m "Daily fetch: race data update"
          git push
      - name: Open an issue if the fetch failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Daily race fetch failed',
              body: `The automatic race fetch failed. Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nThe live site keeps serving the last good data until this is fixed.`,
            });

